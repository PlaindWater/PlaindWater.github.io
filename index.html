<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SummerN's Blog · SummerN</title>
    <meta name="description" content="一个喜欢写代码和文字的开发者，记录学习、思考与探索。" />
    <meta name="author" content="SummerN" />
    <meta name="theme-color" content="#fbfbfd" />
    <link rel="canonical" href="https://plaindwater.github.io/" />
    <link rel="alternate" type="application/rss+xml" title="SummerN's Blog" href="./feed.xml" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SummerN's Blog" />
    <meta property="og:description" content="一个喜欢写代码和文字的开发者，记录学习、思考与探索。" />
    <meta property="og:url" content="https://plaindwater.github.io/" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <script type="module" src="./assets/js/app.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#app">跳到主要内容</a>
    <div class="progress" id="progress" aria-hidden="true"></div>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/" id="brand">SummerN's</a>
        <nav class="site-nav" id="nav" aria-label="主导航"></nav>
        <button class="icon-btn" id="themeToggle" type="button" title="切换主题" aria-label="切换主题"></button>
      </div>
    </header>

    <main id="app">
      <noscript>
        <p style="text-align: center; color: var(--muted)">
          这个博客依赖 JavaScript 渲染文章列表，请在浏览器中启用 JavaScript。
        </p>
      </noscript>
    </main>

    <footer class="site-footer">
      <p>
        © <span id="year">2026</span> <span id="footerAuthor">SummerN</span> · 用文字记录思考 ·
        <a id="rssLink" href="./feed.xml">RSS</a>
      </p>
    </footer>

    <button class="icon-btn back-top" id="backTop" type="button" title="回到顶部" aria-label="回到顶部"></button>
  </body>
</html>
